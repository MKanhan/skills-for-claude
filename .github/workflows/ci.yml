name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run /spec smoke test
        run: bash tests/spec/smoke.sh

      - name: Run /personas smoke test
        run: bash tests/personas/smoke.sh

      - name: Run /audit smoke test
        run: bash tests/audit/smoke.sh
